# DIUx xView 2018 Challenge dataset https://challenge.xviewdataset.org by U.S. National Geospatial-Intelligence Agency (NGA)
# --------  Download and extract data manually to `datasets/xView` before running the train command.  --------
# Documentation: https://docs.ultralytics.com/datasets/detect/xview/
# Example usage: yolo train data=xView.yaml && yolo train data=xView_sliced.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── xView  ← raw data
#     └── xView_sliced  ← sliced data

# Train/val
path: xView_sliced # dataset root dir
train: images/autosplit_train.txt # train images (relative to 'path') 90% of sliced tiles
val: images/autosplit_val.txt # val images (relative to 'path') 10% of sliced tiles

merges:
  0: 1   # Fixed-wing Aircraft -> Fixed-wing Aircraft
  1: 1   # Small Aircraft -> Fixed-wing Aircraft
  2: 1   # Cargo Plane -> Fixed-wing Aircraft
  3: -1   # Helicopter -> Helicopter
  4: -1  # Passenger Vehicle -> drop
  5: -1  # Small Car -> drop
  6: -1  # Bus -> drop
  7: -1  # Pickup Truck -> drop
  8: -1  # Utility Truck -> drop
  9: -1  # Truck -> drop
  10: -1 # Cargo Truck -> drop
  11: -1 # Truck w/Box -> drop
  12: -1 # Truck Tractor -> drop
  13: -1 # Trailer -> drop
  14: -1 # Truck w/Flatbed -> drop
  15: -1 # Truck w/Liquid -> drop
  16: -1 # Crane Truck -> drop
  17: -1 # Railway Vehicle -> drop
  18: -1 # Passenger Car -> drop
  19: -1 # Cargo Car -> drop
  20: -1 # Flat Car -> drop
  21: -1 # Tank car -> drop
  22: -1 # Locomotive -> drop
  23: {"threshold": 15.0, "below": 0, "above": 2}   # Maritime Vessel -> Small Boat or Large Vessel
  24: {"threshold": 15.0, "below": 0, "above": 2}   # Motorboat -> Small Boat or Large Vessel
  25: {"threshold": 15.0, "below": 0, "above": 2}   # Sailboat -> Small Boat or Large Vessel
  26: {"threshold": 15.0, "below": 0, "above": 2}   # Tugboat -> Small Boat or Large Vessel
  27: {"threshold": 15.0, "below": 0, "above": 2}   # Barge -> Small Boat or Large Vessel
  28: {"threshold": 15.0, "below": 0, "above": 2}   # Fishing Vessel -> Small Boat or Large Vessel
  29: {"threshold": 15.0, "below": 0, "above": 2}   # Ferry -> Small Boat or Large Vessel
  30: {"threshold": 15.0, "below": 0, "above": 2}   # Yacht -> Small Boat or Large Vessel
  31: {"threshold": 15.0, "below": 0, "above": 2}   # Container Ship -> Small Boat or Large Vessel
  32: {"threshold": 15.0, "below": 0, "above": 2}   # Oil Tanker -> Small Boat or Large Vessel
  33: -1 # Engineering Vehicle -> drop
  34: -1 # Tower crane -> drop
  35: -1 # Container Crane -> drop
  36: -1 # Reach Stacker -> drop
  37: -1 # Straddle Carrier -> drop
  38: -1 # Mobile Crane -> drop
  39: -1 # Dump Truck -> drop
  40: -1 # Haul Truck -> drop
  41: -1 # Scraper/Tractor -> drop
  42: -1 # Front loader/Bulldozer -> drop
  43: -1 # Excavator -> drop
  44: -1 # Cement Mixer -> drop
  45: -1 # Ground Grader -> drop
  46: -1 # Hut/Tent -> drop
  47: -1 # Shed -> drop
  48: -1 # Building -> drop
  49: -1  # Aircraft Hangar -> Aircraft Hangar
  50: -1 # Damaged Building -> drop
  51: -1 # Facility -> drop
  52: -1 # Construction Site -> drop
  53: -1 # Vehicle Lot -> drop
  54: -1  # Helipad -> Helipad
  55: -1 # Storage Tank -> drop
  56: -1 # Shipping container lot -> drop
  57: -1 # Shipping Container -> drop
  58: -1 # Pylon -> drop
  59: -1 # Tower -> drop

names:
  0: Small Ship
  1: Fixed-wing Aircraft
  2: Large Vessel

# Download script/URL
download: |
  from pathlib import Path

  from medetect.xview.slice import slice_training_images
  from medetect.yolo import relabel_yolo_detect_labels
  from medetect.yolo.tiff2png import convert_tiffs_to_png
  from ultralytics.data.split import autosplit

  sliced_dir = Path(yaml["path"])
  raw_dir = sliced_dir.parent / "xView" # raw data dir

  # Slice
  slice_training_images(
      input_dir=raw_dir,
      output_dir=sliced_dir,
      resolution=0.3,  # (0.5, 5.0),
      image_size=640,
      overlap=0.05,
      min_area_ratio=0.5,
      output_geotiff=True,
      # max_images=30,
      # min_bbox_size=8.0,
  )

  # Relabel
  relabel_yolo_detect_labels(
      dataset_root=sliced_dir,
      merges=yaml["merges"],
      empty_image_ratio=0.05,
  )

  # Convert TIFF to PNG
  convert_tiffs_to_png(sliced_dir)
  
  # Split
  autosplit(sliced_dir / "images" / "train")
