# DIUx xView 2018 Challenge dataset https://challenge.xviewdataset.org by U.S. National Geospatial-Intelligence Agency (NGA)
# --------  Download and extract data manually to `datasets/xView` before running the train command.  --------
# Documentation: https://docs.ultralytics.com/datasets/detect/xview/
# Example usage: yolo train data=xView.yaml && yolo train data=xView_sliced.yaml
# parent
# ├── ultralytics
# └── datasets
#     └── xView  ← raw data
#     └── xView_sliced  ← sliced data

# Train/val
path: xView_sliced # dataset root dir
train: images/autosplit_train.txt # train images (relative to 'path') 90% of sliced tiles
val: images/autosplit_val.txt # val images (relative to 'path') 10% of sliced tiles

# Classes
