[project]
authors = [
    { name = "seeker3600", email = "29515315+seeker3600@users.noreply.github.com" },
]
name = "medetect"
# requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "flatbuffers>=25.12.19,<26",
    "ml-dtypes>=0.5.4,<0.6",
    "onnx>=1.20.1,<2",
    "onnxslim>=0.1.85,<0.2",
    "fiftyone>=1.13.3,<2",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.environments]
default = ["cpu"]
gpu = ["gpu"]

[tool.pixi.activation.env]
PYTHONUTF8 = "1"
OPENCV_LOG_LEVEL = "ERROR"
PYTORCH_ALLOC_CONF = "expandable_segments:True,max_split_size_mb:128"
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True,max_split_size_mb:128"

[tool.pixi.dependencies]
python = "3.13.*"
ipykernel = ">=7.2.0,<8"
kaggle = ">=1.8.4,<2"
ultralytics = ">=8.4.14,<9"
torchvision = ">=0.25.0,<0.26"
rasterio = ">=1.5.0,<2"
albumentations = ">=2.0.8,<3"
pystac-client = ">=0.9.0,<0.10"
planetary-computer = ">=1.0.0,<2"
shapely = ">=2.1.2,<3"
pyshp = ">=3.0.3,<4"
scalene = ">=1.5.51,<2"

[tool.pixi.pypi-dependencies]
medetect = { path = ".", editable = true }
pip-licenses = ">=5.5.1, <6"
pytest = ">=8,<9"

[tool.pixi.feature.cpu.dependencies]
pytorch = "*"

[tool.pixi.feature.cpu.pypi-dependencies]
onnxruntime = ">=1.24.1,<2"

[tool.pixi.feature.cpu.tasks.autosplit]
args = ["dir"]  # 'datasets/xView_sliced/images/train'
cmd = "python -c \"from ultralytics.data.split import autosplit; autosplit(r'{{dir}}')\""

[tool.pixi.feature.cpu.tasks.tiff2png]
args = ["dir"]
cmd = '''
for f in "{{dir}}"/*.tif "{{dir}}"/*.tiff; do
  gdal_translate -of PNG "$f" "${f%.*}.png"
done
'''

# flatbuffers, ml-dtypes, onnx, onnxruntime, onnxslim のみ（ウェブアプリの帰属表示対象パッケージ）。
# トレーニング用ツール（ultralytics, matplotlib, jupyter 等）はウェブアプリの帰属表示対象外のため除外。
[tool.pixi.feature.cpu.tasks.licenses]
cmd = "pip-licenses --format=json --with-urls --packages flatbuffers ml-dtypes onnx onnxruntime onnxslim --output-file=../mefront/scripts/medetect-licenses.json"

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "13.1.*"

[tool.pixi.feature.gpu.pypi-dependencies]
onnxruntime-gpu = ">=1.24.1,<2"

[tool.pixi.feature.gpu.system-requirements]
cuda = "13.0"

[tool.pixi.feature.gpu.tasks.check-gpu]
cmd = "python -c \"import torch; print(torch.__version__); print(torch.cuda.is_available())\""

[tool.pixi.feature.gpu.tasks.resume]
args = ["pt"]
cmd = "python -c \"from ultralytics import YOLO; YOLO(r'{{pt}}').train(resume=True)\""

[tool.pixi.feature.gpu.tasks.licenses-gpu]
cmd = "pip-licenses --format=json --with-urls --packages flatbuffers ml-dtypes onnx onnxruntime-gpu onnxslim --output-file=../mefront/scripts/medetect-licenses.json"
